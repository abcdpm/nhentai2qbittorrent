# ==========================================================
# nHentai 本地下载服务 —— Docker Compose 部署
#
# 注意: compose 不参与镜像构建，仅拉取镜像并运行。
# 镜像由 build-and-push.sh 构建并推送到 Docker Hub，
# 每次推送固定上传两个标签：<IMAGE_TAG 版本号> 与 latest。
#
# 镜像来源由本目录 .env 决定（build-and-push.sh 会自动写入）:
#   DOCKERHUB_USER=llllalex
#   IMAGE_TAG=1.0.0
#
# 部署:
#   docker compose pull && docker compose up -d
# 宿主机端口可改:
#   NH_HOST_PORT=8080 docker compose up -d
# ==========================================================
services:
  nh-server:
    image: ${DOCKERHUB_USER:-llllalex}/nh-download-server:${IMAGE_TAG:-1.0.0}
    container_name: nh-download-server
    restart: unless-stopped
    ports:
      - "${NH_HOST_PORT:-8787}:8787"
    environment:
      # 容器内监听地址（固定 0.0.0.0 才能映射端口）
      NH_HOST: "0.0.0.0"
      NH_PORT: "8787"
      # 其余配置均可用 NH_ 前缀环境变量固定（优先级高于 Web 界面保存值），
      # 例如: NH_REQUEST_INTERVAL_MS: "500"  NH_CONVERT_TO_WEBP: "true"
    volumes:
      # 配置 / API 密钥 / 任务队列 / 运行日志持久化
      - ./data:/app/data
      # 下载的本子（文件夹格式：本子名 [本子id]）
      - ./downloads:/app/downloads

